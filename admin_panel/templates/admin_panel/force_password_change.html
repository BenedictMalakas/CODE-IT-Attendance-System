{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password | CODE-IT</title>
  <link rel="shortcut icon" href="/favicon.ico?v=5" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'student_portal/img/codenew (1)-16.png' %}?v=5" />
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'student_portal/img/codenew (1)-32.png' %}?v=5" />
  <link rel="icon" type="image/png" sizes="48x48" href="{% static 'student_portal/img/codenew (1)-48.png' %}?v=5" />
  <link rel="apple-touch-icon" href="{% static 'student_portal/img/codenew (1).png' %}?v=5" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="{% static 'admin_panel/css/codeit_figma.css' %}" rel="stylesheet" />
  <style>
    .password-field {
      position: relative;
    }
    .password-field .form-control {
      padding-right: 44px;
    }
    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--muted);
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }
  </style>
</head>
<body style="background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center;">

<div class="figma-card p-5" style="max-width:480px; width:100%;">
  <div class="text-center mb-4">
    <img src="{% static 'student_portal/img/codenew (1).jpg' %}?v=5" alt="CODE-IT" style="height:56px; margin-bottom:12px;" />
    <h1 class="figma-heading" style="font-size:22px;">Change Your Password</h1>
    <p class="figma-muted small">You must set a new password before continuing.</p>
  </div>

  {% if messages %}
    {% for msg in messages %}
      <div class="alert alert-{{ msg.tags|default:'info' }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">New Password</label>
      <div class="password-field">
        <input type="password" name="new_password" class="form-control" placeholder="Min 8 chars, 1 special char" required />
        <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
          <i class="fa fa-eye"></i>
        </button>
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label">Confirm Password</label>
      <div class="password-field">
        <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required />
        <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
          <i class="fa fa-eye"></i>
        </button>
      </div>
    </div>
    <button type="submit" class="figma-btn w-100"><i class="fa fa-lock me-2"></i>Set New Password</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.querySelectorAll('.password-toggle').forEach(button => {
    button.addEventListener('click', () => {
      const input = button.parentElement.querySelector('input');
      const icon = button.querySelector('i');
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      button.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      button.setAttribute('aria-pressed', String(!showing));
      icon.className = showing ? 'fa fa-eye' : 'fa fa-eye-slash';
    });
  });
</script>
</body>
</html>
