{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password | CODE-IT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="{% static 'admin_panel/css/codeit_figma.css' %}" rel="stylesheet" />
</head>
<body style="background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center;">

<div class="figma-card p-5" style="max-width:480px; width:100%;">
  <div class="text-center mb-4">
    <img src="{% static 'student_portal/img/codeit_logo.png' %}" alt="CODE-IT" style="height:56px; margin-bottom:12px;" />
    <h1 class="figma-heading" style="font-size:22px;">Change Your Password</h1>
    <p class="figma-muted small">You must set a new password before continuing.</p>
  </div>

  {% if messages %}
    {% for msg in messages %}
      <div class="alert alert-{{ msg.tags|default:'info' }} alert-dismissible fade show" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">New Password</label>
      <input type="password" name="new_password" class="form-control" placeholder="Min 8 chars, 1 special char" required />
    </div>
    <div class="mb-4">
      <label class="form-label">Confirm Password</label>
      <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required />
    </div>
    <button type="submit" class="figma-btn w-100"><i class="fa fa-lock me-2"></i>Set New Password</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
