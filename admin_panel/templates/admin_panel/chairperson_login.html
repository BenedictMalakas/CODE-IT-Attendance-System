<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Access | CODE-IT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #0A0E1A;
      --card-border: #1E1E2E;
      --accent-orange: #F5A623;
      --btn-orange: #E89430;
      --text-dark: #1E1E2E;
      --text-muted: rgba(30,30,46,0.5);
      --input-bg: #E8E4DC;
      --font: 'Outfit', 'Segoe UI', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }
    .blob { position: fixed; border-radius: 50%; filter: blur(100px); opacity: .45; pointer-events: none; z-index: 0; }
    .blob-1 { width: 400px; height: 400px; background: #1a237e; top: -100px; left: -80px; }
    .blob-2 { width: 350px; height: 350px; background: #4a148c; bottom: -70px; right: -50px; }
    .blob-3 { width: 240px; height: 240px; background: #0d47a1; top: 45%; left: 58%; }

    .folder-card { position: relative; z-index: 1; width: 100%; max-width: 400px; }
    .folder-tab { display: inline-block; background: var(--card-border); color: #fff; font-weight: 800; font-size: .9rem; padding: 8px 24px; border-radius: 14px 14px 0 0; }
    .folder-body { background: #fff; border: 3px solid var(--card-border); border-radius: 0 18px 18px 18px; padding: 28px 24px; position: relative; }
    .screw { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #d4d4d4, #888 70%); box-shadow: inset 0 1px 2px rgba(0,0,0,.3); }
    .screw-tl { top: 10px; left: 10px; } .screw-tr { top: 10px; right: 10px; }
    .screw-bl { bottom: 10px; left: 10px; } .screw-br { bottom: 10px; right: 10px; }
    .folder-inner { background: linear-gradient(145deg, #5C6BC0, #7986CB, #9FA8DA); border-radius: 14px; padding: 28px 24px; }

    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-header h1 { font-weight: 900; font-size: 1.5rem; color: var(--accent-orange); margin: 0; }
    .brand-header p { font-size: .75rem; color: rgba(255,255,255,.5); font-weight: 600; margin: 4px 0 0; }

    .codeit-label { font-weight: 700; font-size: .85rem; color: var(--text-dark); margin-bottom: 4px; display: block; }
    .codeit-input { width: 100%; padding: 12px 18px; border: 2px solid transparent; border-radius: 20px; background: var(--input-bg); font-family: var(--font); font-size: .9rem; font-weight: 500; color: var(--text-dark); outline: none; transition: border-color .2s; }
    .codeit-input::placeholder { color: rgba(30,30,46,0.35); }
    .codeit-input:focus { border-color: var(--accent-orange); background: #F5F0E8; }

    .btn-codeit { display: block; width: 100%; padding: 14px; border: 3px solid var(--card-border); background: var(--btn-orange); color: var(--card-border); border-radius: 16px; font-family: var(--font); font-weight: 800; font-size: 1rem; cursor: pointer; transition: all .15s; text-align: center; }
    .btn-codeit:hover { background: #D07A20; transform: translateY(-2px); box-shadow: 0 4px 0 var(--card-border); }

    .pw-toggle { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); background: none; border: none; padding: 0; font-size: .85rem; }
    input::-ms-reveal, input::-ms-clear, input::-webkit-reveal { display: none !important; }
    .alert { border-radius: 12px; font-size: .85rem; font-weight: 600; }
  </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="folder-card">
  <div class="brand-header">
    <h1>CODE-IT</h1>
    <p>Chairperson Access</p>
  </div>

  <div class="folder-tab">System Access</div>
  <div class="folder-body">
    <span class="screw screw-tl"></span><span class="screw screw-tr"></span>
    <span class="screw screw-bl"></span><span class="screw screw-br"></span>
    <div class="folder-inner">
      {% if messages %}{% for msg in messages %}<div class="alert alert-danger py-2 mb-3 small">{{ msg }}</div>{% endfor %}{% endif %}

      <form method="post">
        {% csrf_token %}
        <div style="margin-bottom:16px;">
          <label class="codeit-label">Email</label>
          <input type="email" name="email" class="codeit-input" placeholder="Email" autocomplete="email" required />
        </div>
        <div style="margin-bottom:20px;">
          <label class="codeit-label">Password</label>
          <div style="position:relative;">
            <input type="password" name="password" class="codeit-input" placeholder="Password" autocomplete="current-password" required style="padding-right:3rem;" />
            <button type="button" class="pw-toggle" onclick="togglePw(this)"><i class="fa fa-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn-codeit"><i class="fa fa-shield-halved me-2"></i>Access</button>
      </form>
    </div>
  </div>
</div>

<script>
  function togglePw(btn) {
    const input = btn.parentElement.querySelector('input');
    const icon = btn.querySelector('i');
    if (input.type === 'password') { input.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
    else { input.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
  }
</script>
</body>
</html>
