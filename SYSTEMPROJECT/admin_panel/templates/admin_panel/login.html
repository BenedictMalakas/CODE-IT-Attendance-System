<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | CODE-IT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #1a2238 0%, #2d3a55 100%);
      min-height: 100vh;
      display: flex; flex-direction: column;
      font-family: 'Segoe UI', sans-serif;
      padding: 2.5rem 1rem;
      overflow-x: hidden;
    }
    .login-card {
      width: 100%; max-width: 400px; margin: auto;
      background: #fff; border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      overflow: hidden;
    }
    .login-header {
      background: #1a2238;
      padding: 2rem;
      text-align: center;
    }
    .login-header h1 { font-size: 2rem; font-weight: 800; color: #fff; margin: 0; }
    .login-header h1 span { color: #ff6a3d; }
    .login-header p { color: #8e9bbe; font-size: .88rem; margin: .4rem 0 0; }
    .login-body { padding: 2rem; }
    .btn-login {
      background: #ff6a3d; border: none; color: #fff;
      font-weight: 600; width: 100%; padding: .7rem;
      border-radius: 8px; transition: opacity .2s;
    }
    .btn-login:hover { opacity: .88; color: #fff; }
    .pw-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      cursor: pointer; color: #aab0c0; z-index: 5; background: none; border: none;
      padding: 0; font-size: .95rem;
    }
    .pw-toggle:hover { color: #1a2238; }
    /* Fix for doubling eye icon in Edge/Chrome */
    input::-ms-reveal,
    input::-ms-clear,
    input::-webkit-reveal {
      display: none !important;
    }
    .form-control-password {
      padding-right: 45px !important;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h1><span>CODE</span>-IT</h1>
      <p>QR Attendance System &mdash; Admin</p>
    </div>
    <div class="login-body">
      {% if messages %}
        {% for msg in messages %}
          <div class="alert alert-danger py-2">{{ msg }}</div>
        {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Login as</label>
          {{ form.role }}
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" name="email" class="form-control" autocomplete="email" required />
          {% if form.email.errors %}
            <div class="text-danger small">{{ form.email.errors.0 }}</div>
          {% endif %}
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <div class="position-relative">
            <input type="password" name="password" class="form-control form-control-password" autocomplete="current-password" required />
            <button type="button" class="pw-toggle" onclick="togglePw(this)">
              <i class="fa fa-eye"></i>
            </button>
          </div>
          {% if form.password.errors %}
            <div class="text-danger small">{{ form.password.errors.0 }}</div>
          {% endif %}
        </div>
        <button type="submit" class="btn btn-login">
          <i class="fa fa-right-to-bracket me-2"></i>Sign In
        </button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePw(btn) {
      const input = btn.parentElement.querySelector('input');
      const icon  = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }
  </script>
</body>
</html>
