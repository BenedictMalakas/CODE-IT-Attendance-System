<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Access | CODE-IT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #0d1117 0%, #1a2238 50%, #0d1117 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-card {
      width: 100%; max-width: 380px;
      background: rgba(255,255,255,.97); border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #0d1117 0%, #1a2238 100%);
      padding: 2rem; text-align: center;
    }
    .login-header h1 { font-size: 1.4rem; font-weight: 800; color: #fff; margin: 0; }
    .login-header h1 span { color: #ff6a3d; }
    .login-header p { color: #555e70; font-size: .8rem; margin: .3rem 0 0; }
    .login-body { padding: 2rem; }
    .btn-login {
      background: #ff6a3d; border: none; color: #fff;
      font-weight: 600; width: 100%; padding: .7rem;
      border-radius: 8px;
    }
    .btn-login:hover { opacity: .88; color: #fff; }
    .pw-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      cursor: pointer; color: #aab0c0; z-index: 5; background: none; border: none;
      padding: 0; font-size: .95rem;
    }
    .pw-toggle:hover { color: #1a2238; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h1><span>CODE</span>-IT</h1>
      <p>Chairperson Access</p>
    </div>
    <div class="login-body">
      {% if messages %}
        {% for msg in messages %}
          <div class="alert alert-danger py-2 small">{{ msg }}</div>
        {% endfor %}
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold small">Email</label>
          <input type="email" name="email" class="form-control" placeholder="Email" required />
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold small">Password</label>
          <div class="position-relative">
            <input type="password" name="password" class="form-control" placeholder="Password" required />
            <button type="button" class="pw-toggle" onclick="togglePw(this)">
              <i class="fa fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-login">
          <i class="fa fa-shield-halved me-2"></i>Access
        </button>
      </form>
    </div>
  </div>
  <script>
    function togglePw(btn) {
      const input = btn.parentElement.querySelector('input');
      const icon  = btn.querySelector('i');
      if (input.type === 'password') { input.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
      else { input.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
    }
  </script>
</body>
</html>
